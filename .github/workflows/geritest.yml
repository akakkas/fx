name: ORB geri test
on:
  workflow_dispatch:
  push:
    paths: ["backtest/**", ".github/workflows/geritest.yml"]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas numpy pyarrow
      - uses: actions/cache@v4
        with:
          path: backtest/data
          key: dukascopy-${{ hashFiles('backtest/fetch.py') }}
      - name: Veri indir
        run: python backtest/fetch.py
      - name: Geri test
        run: python backtest/backtest.py
      - name: Sonuçları kaydet
        run: |
          git config user.name "fx-bot"
          git config user.email "fx-bot@users.noreply.github.com"
          git add backtest/results
          git commit -m "Geri test sonuçları" || echo "değişiklik yok"
          git pull --rebase && git push
